<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reventa · Gestión de revendedores</title>
  <link rel="stylesheet" href="css/bootstrap.min.css"><link rel="stylesheet" href="css/styles.css">
  <script src="js/api.js" defer></script><script src="js/app.js" defer></script>
</head>
<body>
  <div class="app-layout">
    <aside class="sidebar">
      <a class="brand" href="#dashboard"><span class="brand-mark" aria-hidden="true">R</span> Reventa<span class="brand-dot">.</span></a>
      <p class="eyebrow nav-label">ESPACIO DE TRABAJO</p>
      <nav id="navigation" aria-label="Módulos principales"></nav>
      <div class="sidebar-footer"><span class="status-dot"></span> Gestión para revendedores</div>
    </aside>
    <div class="workspace">
      <header class="topbar"><span class="text-secondary small">Mi negocio / <span id="breadcrumb">Resumen</span></span><div class="d-flex align-items-center gap-3"><span id="user-label" class="small"></span><button id="logout" class="btn btn-sm btn-outline-secondary">Salir</button></div></header>
      <main id="main" tabindex="-1">
        <div id="message" role="status" aria-live="polite" hidden></div>
        <div id="view" aria-live="polite"><p>Cargando tu espacio de trabajo…</p></div>
      </main>
      <footer class="page-footer">REVENTA <span>Productos, clientes y ventas en un solo lugar.</span></footer>
    </div>
  </div>
  <dialog id="editor" aria-labelledby="editor-title">
    <form id="edit-form">
      <div class="dialog-heading"><h2 id="editor-title" class="h4 mb-0"></h2><button type="button" class="btn-close" aria-label="Cerrar" id="close-editor"></button></div>
      <div id="form-error" role="alert" class="alert alert-danger" hidden></div>
      <div id="fields" class="row g-3"></div>
      <div class="d-flex justify-content-end gap-2 mt-4"><button type="button" class="btn btn-light" id="cancel-editor">Cancelar</button><button class="btn btn-primary" id="save-button" type="submit">Guardar</button></div>
    </form>
  </dialog>
</body>
</html>
